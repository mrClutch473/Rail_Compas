{% load ui %}
{{ cities|json_script:"cities-data" }}
<form action="{% url 'web:search' %}" method="get" class="{% if compact %}grid gap-2 md:grid-cols-[1fr_auto_1fr_200px_auto]{% else %}grid gap-2 md:grid-cols-[1fr_auto_1fr_220px_auto]{% endif %} items-stretch" data-search-form>
  <div class="field" data-city-field>
    <label class="field-label" for="from-name">Откуда</label>
    <input id="from-name" class="field-input" type="text" autocomplete="off" placeholder="Город"
           value="{{ origin.name|default:'' }}" data-city-input required>
    <input type="hidden" name="from" value="{{ origin.slug|default:'' }}" data-city-value>
    <ul class="absolute left-0 right-0 top-full z-40 mt-2 hidden max-h-72 overflow-auto rounded-2xl border border-border bg-surface p-1.5 shadow-float" data-city-list></ul>
  </div>

  <button type="button" class="group mx-auto -my-3 flex h-10 w-10 items-center justify-center self-center rounded-full border border-border bg-surface text-muted shadow-card transition hover:text-brand md:my-0" data-swap aria-label="Поменять города местами">
    <span class="transition duration-300 group-hover:rotate-180">{% icon "swap" 18 %}</span>
  </button>

  <div class="field" data-city-field>
    <label class="field-label" for="to-name">Куда</label>
    <input id="to-name" class="field-input" type="text" autocomplete="off" placeholder="Город"
           value="{{ destination.name|default:'' }}" data-city-input required>
    <input type="hidden" name="to" value="{{ destination.slug|default:'' }}" data-city-value>
    <ul class="absolute left-0 right-0 top-full z-40 mt-2 hidden max-h-72 overflow-auto rounded-2xl border border-border bg-surface p-1.5 shadow-float" data-city-list></ul>
  </div>

  <div class="field">
    <label class="field-label" for="travel-date">Когда</label>
    <input id="travel-date" class="field-input tabular" type="date" name="date"
           value="{% if travel_date %}{{ travel_date|date:'Y-m-d' }}{% else %}{{ default_date|date:'Y-m-d' }}{% endif %}"
           min="{% now 'Y-m-d' %}" max="{{ max_date|date:'Y-m-d' }}" required>
  </div>

  <button type="submit" class="btn-primary h-full min-h-14 rounded-2xl px-6 text-base">
    {% icon "search" 20 %}
    <span>Найти</span>
  </button>
</form>
