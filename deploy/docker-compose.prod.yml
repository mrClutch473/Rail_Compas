name: railcompas

x-app: &app
  build:
    context: ..
  env_file: ../.env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    SCRAPER_DATA_DIR: /data
  volumes:
    - scraper-data:/data
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: railcompas
      POSTGRES_USER: railcompas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railcompas -d railcompas"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  web:
    <<: *app
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2 --access-logfile - --access-logformat '%(h)s "%(r)s" %(s)s %(b)s %(M)sms'
    ports:
      # only on the server itself until nginx + HTTPS arrive (roadmap phase 14)
      - "127.0.0.1:8000:8000"

  worker:
    <<: *app
    command: python manage.py run_worker
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SCRAPER_DATA_DIR: /data
      SCHEDULER_ENABLED: "true"
    stop_grace_period: 60s

volumes:
  pgdata:
  scraper-data:
